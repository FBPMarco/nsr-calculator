<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NSR Calculator</title>
<style>
body {
    font-family: Arial, sans-serif;
    width: 700px;
    margin: 20px auto;
}

h2 {
    margin-bottom: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: black;
    color: white;
    padding: 8px;
}

td {
    border: 1px solid #000;
    padding: 5px;
}

.sku {
    background: #e4d1c4;
    font-weight: bold;
}

.nsr, .total {
    background: #f3dfd2;
    text-align: right;
}

.inputpcs {
    background: white;
}

input {
    width: 100%;
    border: none;
    text-align: center;
    font-size: 14px;
}
.summary {
    margin: 15px 0;
    font-size: 24px;
    font-weight: bold;
}
</style>
</head>
<body>

<h2>NSR CALCULATOR</h2>
<div>CENTRO</div>

<div class="summary">
    Total PCS: <span id="totalPcs">0</span>
    &nbsp;&nbsp;&nbsp;
    Total NSR: ₱<span id="grandTotal">0.00</span>
</div>

<table>
<thead>
<tr>
    <th>SKU</th>
    <th>INPUT PCS</th>
    <th>NSR/PC</th>
    <th>TOTAL NSR</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

<script>
const products = [
    {sku:"MISMO", nsr:166.07},
    {sku:"XL", nsr:642.86},
    {sku:"KASALO", nsr:237.50},
    {sku:"8OZ", nsr:170.24},
    {sku:"CANS", nsr:684.87},
    {sku:"WP1000ml x 12", nsr:151.83},
    {sku:"WP500ml x 24", nsr:183.49},
    {sku:"WP330ml", nsr:174.79},
    {sku:"WD7L x 3", nsr:194.64},
    {sku:"WD1000ml x 12", nsr:238.40},
    {sku:"WD500ml x 24", nsr:314.29},
    {sku:"WD330ml", nsr:268.75}
];

const tbody = document.getElementById("tableBody");

products.forEach((p, index) => {
    tbody.innerHTML += `
    <tr>
        <td class="sku">${p.sku}</td>
        <td class="inputpcs">
            <input type="number" min="0" value="0"
                   oninput="calculate()"
                   id="pcs${index}">
        </td>
        <td class="nsr">${p.nsr.toFixed(2)}</td>
        <td class="total" id="total${index}">0.00</td>
    </tr>`;
});

function calculate() {
    let grandTotal = 0;
    let totalPcs = 0;

    products.forEach((p,index)=>{
        let pcs = Number(document.getElementById(`pcs${index}`).value) || 0;
        let total = pcs * p.nsr;

        document.getElementById(`total${index}`).innerHTML =
            total.toLocaleString(undefined,{
                minimumFractionDigits:2,
                maximumFractionDigits:2
            });

        grandTotal += total;
        totalPcs += pcs;
    });

    document.getElementById("totalPcs").innerHTML =
        totalPcs.toLocaleString();

    document.getElementById("grandTotal").innerHTML =
        grandTotal.toLocaleString(undefined,{
            minimumFractionDigits:2,
            maximumFractionDigits:2
        });
}

calculate();
</script>

</body>
</html>
